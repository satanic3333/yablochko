<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Яблочко 777</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0807;--card:#110f0c;--line:rgba(196,152,84,.26);--line2:rgba(196,152,84,.5);
  --g1:#ecc77d;--g2:#b07f37;--gold:linear-gradient(135deg,#ebc77c 0%,#d4a85f 45%,#a87a33 100%);
  --text:#f4ede1;--muted:#8d8476;color-scheme:dark
}
html,body{background:var(--bg);color:var(--text);font-family:'Manrope',-apple-system,system-ui,sans-serif;min-height:100%}
body{overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:10px 16px calc(100px + env(safe-area-inset-bottom))}
.serif{font-family:'Playfair Display',Georgia,serif}
.goldtxt{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* логотип */
.logo{display:flex;align-items:flex-end;gap:12px;padding:18px 4px 6px}
.logo .ts{width:clamp(30px,9vw,44px);flex:none;margin-bottom:22px}
.logo .tb{width:clamp(84px,26vw,120px);flex:none;margin-left:auto}
.logo-txt{line-height:1}
.l1{font-size:clamp(24px,7.6vw,34px);font-weight:800;letter-spacing:.05em}
.l2{font-size:clamp(34px,10vw,46px);font-weight:800;letter-spacing:.12em;margin-top:8px}
.l3{font-size:clamp(10px,3vw,13px);letter-spacing:.55em;color:#9a9182;margin-top:10px;font-weight:500}

/* поиск */
.search{display:flex;gap:12px;align-items:center;height:54px;border:1px solid var(--line);border-radius:20px;background:#14110c;padding:0 18px;margin:22px 0 18px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:400 16px 'Manrope',sans-serif}
.search input::placeholder{color:#7b7366}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* категории */
.cat{position:relative;aspect-ratio:.86;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--card);text-align:left;font:inherit}
.cat svg,.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cat::before{content:'';position:absolute;inset:0 0 55% 0;background:linear-gradient(#0a0807f0,transparent);z-index:1}
.cat-title{position:absolute;left:16px;top:14px;right:10px;font-size:19px;font-weight:700;z-index:2;text-shadow:0 2px 14px #000;line-height:1.15}
.new{position:absolute;left:14px;bottom:14px;z-index:2;border:1px solid var(--line2);border-radius:99px;padding:6px 14px;font-size:12px;letter-spacing:.2em;color:var(--g1);background:#0a0807b8;font-weight:700}
.note{text-align:center;color:#6f685d;font-size:12px;letter-spacing:.08em;margin:28px 0 6px}

/* заголовки разделов */
.h2{display:flex;align-items:center;gap:12px;font-family:'Playfair Display',serif;font-weight:800;font-size:26px;letter-spacing:.07em;margin:16px 0 18px}
.h2 svg{width:26px;flex:none}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:#120f0b;font:600 14px Manrope}
.chip.on{background:var(--gold);color:#1d1408;border-color:transparent}

/* карточка товара */
.pc{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--card);display:flex;flex-direction:column;cursor:pointer}
.pc-img{position:relative;aspect-ratio:1.25;background:#060504}
.pc-img svg,.pc-img img{width:100%;height:100%;display:block;object-fit:cover}
.heart{position:absolute;right:8px;top:8px;width:38px;height:38px;border-radius:50%;background:rgba(10,8,7,.55);border:1px solid var(--line);display:grid;place-items:center;color:var(--g1)}
.heart.on svg{fill:var(--g1)}
.pc-body{padding:14px 14px 14px;display:flex;flex-direction:column;flex:1}
.pc-name{font-size:15px;font-weight:600;text-transform:uppercase;line-height:1.25}
.pc-sub{color:var(--muted);font-size:13px;margin-top:5px}
.pc-price{font-size:22px;font-weight:700;margin-top:auto;padding:16px 0 12px}
.btn-gold{background:var(--gold);color:#1d1408;border:0;border-radius:16px;height:46px;font:800 15px Manrope;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s}
.btn-gold:active{transform:scale(.97)}
.empty-s{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* страница товара */
.back{background:none;border:0;color:var(--g1);font:600 16px Manrope;padding:6px 0 12px}
.hero{border:1px solid var(--line);border-radius:24px;overflow:hidden;aspect-ratio:1.35;background:#060504}
.hero svg,.hero img{width:100%;height:100%;display:block;object-fit:cover}
.pt{font-size:28px;font-weight:700;margin-top:22px;text-transform:uppercase;line-height:1.15}
.psub{color:var(--muted);letter-spacing:.16em;font-size:12.5px;margin-top:10px;font-weight:600}
.pp{font-size:40px;font-weight:700;margin:20px 0 22px}
.lbl{color:#a39a8b;font-size:16px;margin:4px 0 12px}
.lbl i{color:#e5534b;font-style:normal}
.lbl span{color:#6f685d;font-size:14px;margin-left:6px}
.vars{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.var{min-width:62px;height:46px;padding:0 15px;border-radius:14px;border:1px solid var(--line);background:#120f0b;font:600 15px Manrope}
.var.on{background:var(--gold);color:#1d1408;border-color:transparent}
.buy{display:flex;gap:12px;margin-top:6px}
.qty{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:16px;height:54px;width:128px;flex:none;padding:0 4px;background:#0e0c09}
.qty button{background:none;border:0;color:var(--g1);font-size:24px;width:40px;height:100%}
.qty span{font-weight:700;font-size:18px}
.buy .btn-gold{height:54px;flex:1}
.desc{margin-top:22px;border:1px solid var(--line);border-radius:18px;padding:16px;color:#b8afa1;font-size:14.5px;line-height:1.6;background:#0e0c09}

/* корзина */
.ci{display:flex;gap:14px;border:1px solid var(--line);border-radius:22px;background:#13100c;padding:12px;margin-bottom:12px;position:relative}
.ci-img{width:82px;height:102px;border-radius:14px;overflow:hidden;flex:none;background:#060504}
.ci-img svg,.ci-img img{width:100%;height:100%;display:block;object-fit:cover}
.ci-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ci-name{font-weight:600;font-size:15px;text-transform:uppercase;padding-right:30px;line-height:1.25}
.ci-sub{color:var(--muted);font-size:13px;margin-top:4px}
.ci-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;gap:8px}
.ci .qty{height:42px;width:108px}
.ci .qty button{font-size:20px;width:34px}
.ci-price{font-size:18px;font-weight:700;white-space:nowrap}
.x{position:absolute;right:10px;top:8px;width:34px;height:34px;background:none;border:0;color:#8d8476;font-size:24px;line-height:1}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:24px 6px 18px;font-size:21px;font-weight:700}
.total b{font-size:32px}
.btn-big{height:60px;font-size:19px;border-radius:20px}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
.empty p{margin-bottom:18px}

/* таббар */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#0b0907;border-top:1px solid rgba(196,152,84,.18);display:flex;justify-content:space-around;padding:9px 0 calc(9px + env(safe-area-inset-bottom));z-index:20}
.tab{color:#8d8476;display:flex;flex-direction:column;align-items:center;gap:5px;font:500 13px Manrope;background:none;border:0;width:33%;position:relative}
.tab.on{color:var(--g1)}
.badge{position:absolute;top:-6px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#1d1408;font:800 11px Manrope;display:none;align-items:center;justify-content:center;padding:0 5px}

/* тост */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#16120d;border:1px solid var(--line2);border-radius:18px;padding:13px 22px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px;z-index:60;transition:.25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:var(--g1)}
.toast.err svg{color:#e5534b}

/* страница оформления */
.box{border:1px solid var(--line);border-radius:28px;padding:24px 18px;position:relative;background:#0c0a08;margin-bottom:34px}
.box .st{position:absolute;left:50%;width:34px;height:22px;transform:translate(-50%,-50%);background:var(--bg);display:grid;place-items:center}
.box .st.t{top:0}.box .st.b{top:100%}
.box h4{font-size:24px;font-weight:800;color:var(--g1);margin:0 0 18px 2px}
.opt{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:22px;padding:20px 16px;margin-bottom:12px;background:#12100c;width:100%;text-align:left;font:inherit}
.opt.on{border-color:var(--line2);box-shadow:0 0 22px rgba(212,168,95,.13)}
.radio{width:28px;height:28px;border-radius:50%;border:2px solid #d4a85f;flex:none;display:grid;place-items:center}
.opt.on .radio::after{content:'';width:15px;height:15px;border-radius:50%;background:#d4a85f}
.opt b{display:block;font-size:17px;font-weight:700;line-height:1.25}
.opt small{display:block;color:var(--muted);font-size:15px;margin-top:5px}
.fee{margin-left:auto;border:1px solid var(--line2);border-radius:14px;padding:9px 13px;color:var(--g1);font-weight:800;font-size:14px;white-space:nowrap}
.ln{display:flex;justify-content:space-between;gap:12px;padding:16px 2px;border-bottom:1px solid rgba(196,152,84,.16);font-size:16.5px}
.ln small{display:block;color:var(--muted);font-size:15px;margin-top:5px}
.ln .pr{color:var(--g1);font-weight:800;white-space:nowrap}
.itog{display:flex;justify-content:space-between;align-items:baseline;padding:24px 2px 26px;font-size:23px;font-weight:800}
.itog b{color:var(--g1)}
.btn-out{height:58px;border:1px solid var(--line2);border-radius:20px;background:none;color:var(--g1);font:800 17px Manrope;width:100%;display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px}
.hint{text-align:center;color:var(--muted);font-size:14.5px;line-height:1.5;margin-top:12px}
.backcart{display:flex;align-items:center;justify-content:center;gap:18px;width:100%;height:78px;border:1px solid var(--line);border-radius:26px;background:#0c0a08;color:var(--g1);font:800 19px Manrope}
.backcart i{width:46px;height:46px;border:1px solid var(--line2);border-radius:14px;display:grid;place-items:center;font-style:normal}
.foot-tower{display:flex;justify-content:center;margin-top:34px}
.foot-tower svg{width:40px}

/* оформление (старое окно) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:560px;background:#110e0b;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:5px;border-radius:3px;background:#3a332a;margin:0 auto 14px}
.sheet h3{font-size:26px;font-weight:800;margin-bottom:16px;letter-spacing:.04em}
.field{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:#16120d;color:var(--text);padding:0 15px;font:16px Manrope;margin-bottom:10px;outline:0}
textarea.field{height:84px;padding:13px 15px;resize:none}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg .var{flex:1}
.sheet .total{margin:16px 4px 16px}
.ok{text-align:center;padding:24px 6px 10px}
.ok .big{width:70px;height:70px;border-radius:50%;background:var(--gold);display:grid;place-items:center;margin:0 auto 18px;color:#1d1408}
.ok p{color:var(--muted);line-height:1.55;margin:10px 0 22px}
</style>
</head>
<body>

<!-- общие градиенты и ночной город -->
<svg style="position:absolute;width:0;height:0" aria-hidden="true">

<div class="app">
  <section id="v-home" class="view on">

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d4a85f" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>

function star(cx,cy,r){let p='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.42:r;p+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(2)+' '+(cy+rr*Math.sin(a)).toFixed(2)}return p+'Z'}
function towerWide(fill,winFill){

  for(const y of [172,186,198]){for(let x=7;x<=23;x+=8)w+=`<rect x="${x}" y="${y}" width="4" height="7"/>`;for(let x=113;x<=129;x+=8)w+=`<rect x="${x}" y="${y}" width="4" height="7"/>`}

  for(const y of [124,136])for(let x=52;x<=84;x+=8)w+=`<rect x="${x}" y="${y}" width="4" height="7"/>`;
  for(let x=60;x<=76;x+=8)w+=`<rect x="${x}" y="76" width="4" height="7"/>`;
  return `<path d="${TOWER_WIDE} ${star(70,8,7)}" fill="${fill}"/><g fill="${winFill}">${w}</g>`;

(function buildSky(){
  let s=11; const r=()=>(s=(s*9301+49297)%233280)/233280;
  let b='',win='',ref='',x=0;
  while(x<700){
    const bw=14+r()*34, bh=30+r()*110;
    b+=`M${x.toFixed(1)} 300V${(300-bh).toFixed(1)}H${(x+bw).toFixed(1)}V300Z`;
    const cols=Math.max(1,Math.floor(bw/8));
    for(let yy=300-bh+6;yy<294;yy+=8)for(let c=0;c<cols;c++)if(r()<.22)win+=`<rect x="${(x+3+c*8).toFixed(1)}" y="${yy.toFixed(1)}" width="2.4" height="2.8" opacity="${(.35+r()*.6).toFixed(2)}"/>`;
    for(let k=0;k<2;k++)if(r()<.6)ref+=`<rect x="${(x+r()*bw).toFixed(1)}" y="${(304+r()*95).toFixed(1)}" width="${(4+r()*18).toFixed(1)}" height="1.4" opacity="${(.08+r()*.22).toFixed(2)}"/>`;
    x+=bw+1+r()*3;
  }
  document.getElementById('sky').innerHTML =
    `<path d="${b}" fill="#120e0a"/><g transform="translate(232,69) scale(1.1)">${towerWide('#17110b','#d9a24a')}</g><g fill="#e0a64c">${win}</g><g fill="#e0a64c">${ref}</g>`;
})();

/* ---------- графика: айфон ---------- */
function phone(x,y,w,h,col,type){
  const r=w*.18, P=(fx,fy)=>[x+fx*w,y+fy*h];
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${col}"/>`+
        `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="url(#sheen)"/>`+
        `<rect x="${x+.8}" y="${y+.8}" width="${w-1.6}" height="${h-1.6}" rx="${r}" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.2"/>`;
  const lens=(fx,fy,rr)=>{const [cx,cy]=P(fx,fy),R=rr*w;return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#0b0b0d" stroke="rgba(150,150,160,.55)" stroke-width="${w*.022}"/><circle cx="${cx}" cy="${cy}" r="${R*.55}" fill="#1a2434"/><circle cx="${cx-R*.22}" cy="${cy-R*.22}" r="${R*.16}" fill="rgba(255,255,255,.55)"/>`};
  const flash=(fx,fy)=>{const [cx,cy]=P(fx,fy);return `<circle cx="${cx}" cy="${cy}" r="${w*.04}" fill="#f2e6c4"/>`};
  const plate=(fx,fy,fw,fh,rx)=>`<rect x="${x+fx*w}" y="${y+fy*h}" width="${fw*w}" height="${fh*h}" rx="${rx*w}" fill="rgba(0,0,0,.2)" stroke="rgba(255,255,255,.18)"/>`;
  if(type==='pro17') s+=plate(.05,.025,.9,.23,.14)+lens(.25,.075,.1)+lens(.25,.195,.1)+lens(.47,.135,.1)+flash(.76,.075)+flash(.76,.19);
  else if(type==='air') s+=plate(.05,.025,.9,.1,.1)+lens(.22,.075,.08)+flash(.4,.075);
  else if(type==='base') s+=plate(.08,.025,.3,.235,.15)+lens(.23,.075,.1)+lens(.23,.19,.1)+flash(.5,.07);
  else if(type==='diag') s+=plate(.07,.025,.5,.235,.13)+lens(.2,.075,.095)+lens(.43,.19,.095)+flash(.43,.07);
  else s+=plate(.07,.025,.56,.265,.14)+lens(.22,.075,.1)+lens(.22,.21,.1)+lens(.46,.142,.1)+flash(.47,.06);
  return s;
}

// витрина: ночной город + подиумы + номера
function showcase(colors,type,o={}){
  const R=o.R||1.25, nums=o.numbers!==false;
  const w=100,h=206,slot=134,rowH=h+(nums?96:62);
  const n=colors.length, rows=n>(o.maxPer||7)?2:1, per=Math.ceil(n/rows);
  let W=per*slot+40, H=rows*rowH+40;
  if(W/H<R) W=H*R; else H=W/R;
  const top=H-rows*rowH-(nums?6:14), hz=top+30+h*.6;
  let g=`<rect width="${W}" height="${H}" fill="#060504"/><ellipse cx="${W/2}" cy="${hz}" rx="${W*.8}" ry="${H*.55}" fill="url(#skyGlow)"/><rect y="${hz}" width="${W}" height="${Math.max(0,H-hz)}" fill="url(#water)"/>`;
  let tx=W/2-350; while(tx>0) tx-=700;
  for(;tx<W;tx+=700) g+=`<use href="#sky" x="${tx}" y="${hz-300}"/>`;
  colors.forEach((c,i)=>{
    const row=Math.floor(i/per), k=i%per, inRow=Math.min(per,n-row*per);
    const cx=W/2+(k-(inRow-1)/2)*slot, by=top+row*rowH+30+h;
    g+=`<rect x="${cx-w*.8}" y="${by+4}" width="${w*1.6}" height="16" fill="#0d0b09"/>`+
       `<ellipse cx="${cx}" cy="${by+20}" rx="${w*.8}" ry="${w*.13}" fill="#0b0907" stroke="url(#goldStroke)" stroke-opacity=".45"/>`+
       `<ellipse cx="${cx}" cy="${by+4}" rx="${w*.8}" ry="${w*.15}" fill="url(#podTop)" stroke="url(#goldStroke)" stroke-width="2.6" filter="url(#glow)"/>`+
       phone(cx-w/2,by-h+4,w,h,c.c,type);
    if(nums) g+=`<text x="${cx}" y="${by+66}" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-weight="700" font-size="44" fill="url(#goldText)">${i+1}</text>`;
  });
  return `<svg viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Фото товара">${g}</svg>`;
}

    <div class="box">
      <h4>1. Способ получения:</h4>
      ${DELIVERY.map(o=>`<button class="opt ${o.id===dlv?'on':''}" onclick="dlv='${o.id}';haptic();renderCheckout()">
        <span class="radio"></span><span><b>${o.name}</b><small>${o.sub}</small></span>
        ${o.fee?`<span class="fee">+${fmt(o.fee)}</span>`:''}</button>`).join('')}
      ${d.needAddr?`<input class="field" id="f-addr" placeholder="Адрес (у метро или станции МЦД)" value="${esc(addr)}" oninput="addr=this.value" autocomplete="street-address" style="margin:4px 0 0">`:''}
      <span class="st b">${STAR4}</span>
    </div>
    <div class="box">
      <span class="st t">${STAR4}</span>
      <h4>2. Ваш заказ:</h4>
      ${cart.map(it=>{const p=byId(it.id);return `<div class="ln"><span>${esc(p.name)} × ${it.q}<small>№${it.c+1} · ${p.mem[it.m].v}</small></span><span class="pr">${fmt(p.mem[it.m].p*it.q)}</span></div>`}).join('')}
      <div class="ln"><span>Получение<small>${d.name}</small></span><span class="pr">${d.fee?fmt(d.fee):'Бесплатно'}</span></div>
      <div class="itog"><span>Итого</span><b>${fmt(grand())}</b></div>
      <button class="btn-gold btn-big" onclick="sendOrder()">${ICO_SEND} Отправить менеджеру</button>
      <button class="btn-out" onclick="copyOrder()">${ICO_COPY} Скопировать заказ</button>
      <p class="hint">Оплата не требуется — менеджер свяжется с вами и подтвердит заказ в Telegram.</p>
      <span class="st b">${STAR4}</span>
    </div>
    <button class="backcart" onclick="show('cart')"><i>${'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>'}</i>Назад в корзину</button>
    <div class="foot-tower">${TINY_TOWER}</div>`;
}
function orderText(){
  const d=curD(), u=inTG&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  const lines=cart.map((it,i)=>{const p=byId(it.id);return `${i+1}. ${p.name} × ${it.q} — №${it.c+1} ${p.colors[it.c].n}, ${p.mem[it.m].v} — ${fmt(p.mem[it.m].p*it.q)}`});
  return `🛒 Заказ — ЯБЛОЧКО 777\n\n${lines.join('\n')}\n\nПолучение: ${d.name}${d.fee?' (+'+fmt(d.fee)+')':''}${d.needAddr?'\nАдрес: '+addr.trim():''}\nИтого: ${fmt(grand())}${u&&u.username?'\n\nTelegram: @'+u.username:''}`;
}
function checkAddr(){
  if(curD().needAddr && !addr.trim()){ toast('Укажите адрес доставки',true); const f=document.getElementById('f-addr'); f&&f.focus(); return false }
  return true;
}
function sendOrder(){
  if(!checkAddr()) return;
  // Открыто кнопкой бота (клавиатура) — отправляем заказ прямо в бота
  const fromKeyboard = inTG && typeof tg.sendData==='function' && !(tg.initDataUnsafe && tg.initDataUnsafe.query_id);
  if(fromKeyboard){
    const d=curD();
    const payload = JSON.stringify({
      items: cart.map(it=>{const p=byId(it.id);return {n:p.name, v:`№${it.c+1} ${p.colors[it.c].n}, ${p.mem[it.m].v}`, q:it.q, s:p.mem[it.m].p*it.q}}),
      d: d.name, fee: d.fee, addr: d.needAddr ? addr.trim() : '', total: grand()
    });
    if(new Blob([payload]).size <= 4096){
      const backup = cart.slice();
      try{
        try{ tg.HapticFeedback.notificationOccurred('success') }catch(e){}
        cart=[]; save(); updBadge();
        tg.sendData(payload);   // приложение закроется, заказ придёт в бота
        return;
      }catch(e){ cart=backup; save(); updBadge(); }
    }
  }
  // Запасной вариант — чат с менеджером с готовым текстом
  const url='https://t.me/'+MANAGER+'?text='+encodeURIComponent(orderText());
  try{ tg.HapticFeedback.notificationOccurred('success') }catch(e){}
  if(inTG) tg.openTelegramLink(url); else window.open(url,'_blank');
}
function copyOrder(){
  if(!checkAddr()) return;
  const t=orderText();
  const done=()=>{ haptic('medium'); toast('Заказ скопирован') };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));
  else fallbackCopy(t,done);
}
function fallbackCopy(t,done){
  const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0';
  document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); done() }catch(e){ toast('Не удалось скопировать',true) } a.remove();
}
function closeSheet(){ document.getElementById('sheetBg').classList.remove('on') }

/* ---------- старт ---------- */
document.getElementById('q').addEventListener('input',e=>{ query=e.target.value.trim(); renderHome() });
render();
</script>
</body>
</html>
